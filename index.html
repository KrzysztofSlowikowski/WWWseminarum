<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prezentacja: Wydajność, SEO, Dostępność</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(255,255,255,0.1);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 {
            margin-bottom: 2rem;
            font-size: 2.5rem;
        }
        .buttons {
            display: flex;
            gap: 2rem;
            justify-content: center;
        }
        .btn {
            padding: 1rem 2.5rem;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-danger {
            background: #ff4757;
            color: white;
            box-shadow: 0 5px 15px rgba(255,71,87,0.4);
        }
        .btn-success {
            background: #00b894;
            color: white;
            box-shadow: 0 5px 15px rgba(0,184,148,0.4);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .note {
            margin-top: 2rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Seminarium: Wydajność, SEO, Dostępność</h1>
        <p>Wybierz wersję strony do analizy:</p>
        <div class="buttons">
            <a href="zla.html" class="btn btn-danger">🔴 Strona Zła (Antywzorzec)</a>
            <a href="dobra.html" class="btn btn-success">🟢 Strona Dobra (Wzór)</a>
        </div>
        <p class="note">Uruchom narzędzie Lighthouse (F12 -> Lighthouse) na obu wersjach i porównaj wyniki!</p>
    </div>
</body>
</html>
